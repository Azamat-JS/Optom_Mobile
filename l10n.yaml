# gen-l10n config. app_uz.arb is the template (source of truth for keys and
# placeholders); app_ru.arb / app_en.arb must define every key it does.
arb-dir: lib/l10n
template-arb-file: app_uz.arb
output-localization-file: app_localizations.dart
output-class: AppLocalizations
nullable-getter: false
untranslated-messages-file: build/l10n_untranslated.json
