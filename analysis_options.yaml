# This file configures the analyzer, which statically analyzes Dart code to
# check for errors, warnings, and lints.
#
# `flutter analyze` must run clean before any milestone branch is merged —
# see the bsmart implementation plan.
#
# Note: riverpod_lint/custom_lint are deliberately NOT enabled here — as of
# this writing their resolved `analyzer_plugin` dependency (0.12.0) is
# incompatible with the `analyzer` version (7.6.0) pulled in by this
# project's other dependencies (fails to compile the analyzer plugin host).
# Revisit once riverpod_lint/custom_lint publish a compatible release.

include: package:flutter_lints/flutter.yaml

analyzer:
  exclude:
    - "**/*.g.dart"
    - "**/*.freezed.dart"
    - "**/*.config.dart"

linter:
  rules:
    prefer_single_quotes: true
