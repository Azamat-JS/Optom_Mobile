name: bsmart
description: "bsmart — native mobile app for the Optom Savdo B2B2C wholesale trading platform."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter
  # i18n: uz (default) / ru / en via gen-l10n — ARB files in lib/l10n, see l10n.yaml
  flutter_localizations:
    sdk: flutter

  # State management (hand-written Notifier/AsyncNotifier — see the note in
  # analysis_options.yaml on why riverpod_generator's code-gen is disabled
  # for now)
  flutter_riverpod: ^2.6.1

  # Dependency injection (Clean Architecture wiring)
  get_it: ^8.0.2

  # Networking
  dio: ^5.7.0
  pretty_dio_logger: ^1.4.0

  # Routing
  go_router: ^14.6.0

  # Secure token storage
  flutter_secure_storage: ^9.2.2

  # Offline-first local cache (read-cache layer; own Postgres backend stays source of truth)
  hive_ce: ^2.10.0
  hive_ce_flutter: ^2.1.0
  connectivity_plus: ^6.1.0

  # Forms & validation
  reactive_forms: ^17.0.0

  # Native barcode scanning
  mobile_scanner: ^6.0.2

  # Charts (dashboards/reports)
  fl_chart: ^0.69.0

  # Animations & modern UX
  flutter_animate: ^4.5.2
  lottie: ^3.2.0
  shimmer: ^3.0.0

  # Utilities
  intl: ^0.20.2
  cached_network_image: ^3.4.1
  image_picker: ^1.1.2
  shared_preferences: ^2.3.3
  flutter_dotenv: ^5.2.1
  share_plus: ^10.1.2
  logger: ^2.4.0

  cupertino_icons: ^1.0.8
  socket_io_client: ^3.1.6
  geolocator: ^14.0.2
  permission_handler: ^12.0.1
  google_maps_flutter: ^2.18.1
  url_launcher: ^6.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  mocktail: ^1.0.4

flutter:
  uses-material-design: true
  # Generates lib/l10n/app_localizations*.dart from the ARB files on every
  # `flutter pub get` / build (no build_runner involved).
  generate: true

  assets:
    - .env
